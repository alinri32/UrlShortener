version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: urlshortener-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./sql/URLShortener.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shortener-net

  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-api
    depends_on:
      - sqlserver
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=UrlShortenerDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Max Pool Size=200;Min Pool Size=10;
    networks:
      - shortener-net

volumes:
  mssql_data:

networks:
  shortener-net:
    driver: bridge